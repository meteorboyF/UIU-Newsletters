<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIU Newsletters</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 50px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .newsletter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .newsletter-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .newsletter-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .newsletter-card:hover::before {
            opacity: 0.9;
        }

        .newsletter-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .newsletter-card:hover .card-content {
            color: white;
        }

        .card-content {
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .newsletter-month {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .newsletter-year {
            font-size: 1rem;
            opacity: 0.8;
        }

        .badge {
            display: inline-block;
            background: #FF5722;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .container {
                padding: 30px;
            }

            .newsletter-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📰 UIU Newsletters</h1>
        <p class="subtitle">United International University Monthly Newsletters</p>

        <div class="newsletter-grid">
            <a href="february/" class="newsletter-card">
                <div class="card-content">
                    <div class="newsletter-month">February</div>
                    <div class="newsletter-year">2026</div>
                    <span class="badge">Latest</span>
                </div>
            </a>

            <a href="January Newsletter/UIU_Jan_Newsletter/" class="newsletter-card">
                <div class="card-content">
                    <div class="newsletter-month">January</div>
                    <div class="newsletter-year">2026</div>
                </div>
            </a>

            <a href="UIU_Nov_Newsletter/UIU_Nov_Newsletter/" class="newsletter-card">
                <div class="card-content">
                    <div class="newsletter-month">November</div>
                    <div class="newsletter-year">2025</div>
                </div>
            </a>
        </div>
    </div>
</body>

</html>
