<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIU Newsletters - United International University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f4c81 0%, #1a7a3e 50%, #0d3d5c 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        .particle:nth-child(1) {
            width: 80px;
            height: 80px;
            left: 10%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            width: 60px;
            height: 60px;
            left: 30%;
            animation-delay: 2s;
        }

        .particle:nth-child(3) {
            width: 100px;
            height: 100px;
            left: 50%;
            animation-delay: 4s;
        }

        .particle:nth-child(4) {
            width: 70px;
            height: 70px;
            left: 70%;
            animation-delay: 6s;
        }

        .particle:nth-child(5) {
            width: 90px;
            height: 90px;
            left: 85%;
            animation-delay: 8s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.3;
            }

            90% {
                opacity: 0.3;
            }

            50% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0.5;
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            max-width: 1100px;
            width: 100%;
            padding: 60px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        .uiu-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #0f4c81, #1a7a3e);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            box-shadow: 0 10px 30px rgba(15, 76, 129, 0.3);
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            color: #0f4c81;
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #0f4c81, #1a7a3e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #555;
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .tagline {
            color: #1a7a3e;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .newsletter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .newsletter-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            border-radius: 20px;
            padding: 40px 30px;
            text-decoration: none;
            color: #333;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .newsletter-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f4c81 0%, #1a7a3e 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 0;
        }

        .newsletter-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            transform: rotate(45deg);
            transition: all 0.6s ease;
        }

        .newsletter-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 20px 50px rgba(15, 76, 129, 0.3);
            border-color: #1a7a3e;
        }

        .newsletter-card:hover::before {
            opacity: 1;
        }

        .newsletter-card:hover::after {
            top: -100%;
            right: -100%;
        }

        .newsletter-card:hover .card-content {
            color: white;
        }

        .newsletter-card:hover .badge {
            background: white;
            color: #1a7a3e;
        }

        .card-content {
            position: relative;
            z-index: 1;
            transition: color 0.4s ease;
        }

        .newsletter-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
            filter: grayscale(0.3);
            transition: all 0.4s ease;
        }

        .newsletter-card:hover .newsletter-icon {
            filter: grayscale(0) brightness(1.2);
            transform: scale(1.1) rotate(5deg);
        }

        .newsletter-month {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .newsletter-year {
            font-size: 1.1rem;
            opacity: 0.7;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #1a7a3e, #0f4c81);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(26, 122, 62, 0.3);
            transition: all 0.3s ease;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid rgba(15, 76, 129, 0.1);
        }

        .footer-text {
            color: #666;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .footer-link {
            color: #1a7a3e;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer-link:hover {
            color: #0f4c81;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            .container {
                padding: 40px 25px;
            }

            .newsletter-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .newsletter-card {
                padding: 35px 25px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .uiu-logo {
                width: 60px;
                height: 60px;
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <div class="header">
            <div class="uiu-logo">UIU</div>
            <h1>Monthly Newsletters</h1>
            <p class="subtitle">United International University</p>
            <p class="tagline">Excellence • Innovation • Leadership</p>
        </div>

        <div class="newsletter-grid">
            <a href="february/" class="newsletter-card">
                <div class="card-content">
                    <span class="newsletter-icon">📰</span>
                    <div class="newsletter-month">February</div>
                    <div class="newsletter-year">2026</div>
                    <span class="badge">Latest Edition</span>
                </div>
            </a>

            <a href="January Newsletter/UIU_Jan_Newsletter/" class="newsletter-card">
                <div class="card-content">
                    <span class="newsletter-icon">📖</span>
                    <div class="newsletter-month">January</div>
                    <div class="newsletter-year">2026</div>
                </div>
            </a>

            <a href="UIU_Nov_Newsletter/UIU_Nov_Newsletter/" class="newsletter-card">
                <div class="card-content">
                    <span class="newsletter-icon">📚</span>
                    <div class="newsletter-month">November</div>
                    <div class="newsletter-year">2025</div>
                </div>
            </a>
        </div>

        <div class="footer">
            <p class="footer-text">
                © 2026 United International University. All rights reserved.<br>
                <a href="https://www.uiu.ac.bd" class="footer-link" target="_blank">Visit UIU Website →</a>
            </p>
        </div>
    </div>
</body>

</html>
